<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Smart Home Monitoring System wiring diagram</title>
<rect width="680" height="470" fill="#ffffff"/>
<text x="100" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Inputs (sensors)</text>
<text x="570" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Outputs</text>
<rect x="260" y="56" width="160" height="314" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Arduino Uno</text>
<line x1="170" y1="100" x2="260" y2="100" stroke="#1D9E75" stroke-width="2"/>
<line x1="170" y1="150" x2="260" y2="150" stroke="#1D9E75" stroke-width="2"/>
<line x1="170" y1="190" x2="260" y2="190" stroke="#1D9E75" stroke-width="2"/>
<line x1="170" y1="245" x2="260" y2="245" stroke="#1D9E75" stroke-width="2"/>
<line x1="170" y1="310" x2="260" y2="310" stroke="#1D9E75" stroke-width="2"/>
<line x1="420" y1="100" x2="500" y2="100" stroke="#D85A30" stroke-width="2"/>
<line x1="420" y1="166" x2="500" y2="166" stroke="#D85A30" stroke-width="2"/>
<line x1="420" y1="232" x2="500" y2="232" stroke="#D85A30" stroke-width="2"/>
<line x1="420" y1="285" x2="500" y2="285" stroke="#D85A30" stroke-width="2"/>
<line x1="420" y1="315" x2="500" y2="315" stroke="#D85A30" stroke-width="2"/>
<text x="272" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">D2</text>
<text x="272" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">D3</text>
<text x="272" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">D4</text>
<text x="272" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">D5</text>
<text x="272" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">A0</text>
<text x="408" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">D8</text>
<text x="408" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">D9</text>
<text x="408" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">D10</text>
<text x="408" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">A4 (SDA)</text>
<text x="408" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">A5 (SCL)</text>
<text x="340" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">5V and GND pins</text>
<rect x="30" y="72" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="100.0" y="90.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="central">DHT22</text>
<text x="100.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">SDA (data) pin</text>
<rect x="30" y="138" width="140" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="100.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="central">HC-SR04</text>
<text x="100.0" y="180.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">TRIG top, ECHO below</text>
<rect x="30" y="217" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="100.0" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="central">PIR sensor</text>
<text x="100.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">OUT pin</text>
<rect x="30" y="282" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="100.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041" text-anchor="middle" dominant-baseline="central">LDR module</text>
<text x="100.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">AO pin</text>
<rect x="500" y="72" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="570.0" y="90.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#712B13" text-anchor="middle" dominant-baseline="central">Buzzer</text>
<text x="570.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">+ pin, other to GND</text>
<rect x="500" y="138" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="570.0" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#712B13" text-anchor="middle" dominant-baseline="central">Green LED</text>
<text x="570.0" y="176.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">via 220 ohm resistor</text>
<rect x="500" y="204" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="570.0" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#712B13" text-anchor="middle" dominant-baseline="central">Red LED</text>
<text x="570.0" y="242.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">via 220 ohm resistor</text>
<rect x="500" y="270" width="140" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="570.0" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#712B13" text-anchor="middle" dominant-baseline="central">I2C LCD 16x2</text>
<text x="570.0" y="311.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">SDA top, SCL below</text>
<rect x="150" y="395" width="380" height="44" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">Power: every VCC to 5V, every GND to GND</text>
<text x="340" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">LED cathodes and buzzer negative also to GND</text>
</svg>